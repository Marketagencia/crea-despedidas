server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Compresión ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/manifest+json;

    # --- Cabeceras de seguridad ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- URLs limpias: /ruta/ -> /ruta/index.html ---
    location / {
        try_files $uri $uri/ =404;
    }

    # --- Cache de estáticos ---
    # CSS/JS llevan ?v=NN, se puede cachear fuerte
    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    # Imágenes / iconos
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    # HTML: revalidar siempre para ver cambios al instante
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Ocultar ficheros ocultos
    location ~ /\. { deny all; }
}
